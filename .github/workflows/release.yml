name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/dvsawr/taiga-metrics-extension

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the project version
        run: |
          version="${GITHUB_REF_NAME#v}"
          project="$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)"
          test "$version" = "$project" || { echo "Tag $version does not match pyproject.toml $project"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=Taiga Metrics
            org.opencontainers.image.description=Flow and team metrics for self-hosted Taiga. An independent project, not affiliated with or endorsed by Taiga or Kaleidos Inc.
            org.opencontainers.image.licenses=MIT

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Pin the image version in the deploy files
        run: |
          mkdir release
          for file in taiga-metrics.yml taiga-metrics-standalone.yml; do
            sed "s/\${TAIGA_METRICS_VERSION:-latest}/\${TAIGA_METRICS_VERSION:-$VERSION}/g" "deploy/$file" > "release/$file"
          done
          cp deploy/taiga-metrics.sh deploy/taiga-metrics.env.example release/

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --title "$GITHUB_REF_NAME" --generate-notes
